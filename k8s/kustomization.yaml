# Ponto de entrada que o ArgoCD lê (path: k8s).
# As tags das imagens são atualizadas automaticamente pelo GitHub Actions
# (.github/workflows/cd.yml) com o Git SHA do commit que as construiu.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ticketmei

labels:
- pairs:
    app.kubernetes.io/part-of: ticketmei

resources:
- namespace.yaml
- infra/redis.yaml
- infra/rabbitmq.yaml
- apps/catalog.yaml
- apps/order.yaml
- apps/notification.yaml
- apps/api-gateway.yaml
- monitoring/prometheus.yaml
- monitoring/grafana.yaml

configMapGenerator:
- literals:
  - enabled_plugins=[rabbitmq_management,rabbitmq_prometheus].
  name: rabbitmq-plugins
- files:
  - prometheus.yml=monitoring/prometheus-k8s.yml
  name: prometheus-config
- files:
  - monitoring/grafana/provisioning/datasources/prometheus.yml
  name: grafana-datasources
- files:
  - monitoring/grafana/provisioning/dashboards/dashboards.yml
  name: grafana-dashboard-provider
- files:
  - monitoring/grafana/dashboards/gateway.json
  - monitoring/grafana/dashboards/catalog.json
  - monitoring/grafana/dashboards/order-notification.json
  name: grafana-dashboards

images:
- name: ghcr.io/francisco3222/ticketmei-api-gateway
  newTag: 5aae65966d244b754391f93a9dbf1294852f91d3
- name: ghcr.io/francisco3222/ticketmei-catalog
  newTag: 5aae65966d244b754391f93a9dbf1294852f91d3
- name: ghcr.io/francisco3222/ticketmei-notification
  newTag: 5aae65966d244b754391f93a9dbf1294852f91d3
- name: ghcr.io/francisco3222/ticketmei-order
  newTag: 5aae65966d244b754391f93a9dbf1294852f91d3
