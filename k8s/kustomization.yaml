# Ponto de entrada que o ArgoCD lê (path: k8s).
# Cluster LOCAL (Docker Desktop / k3s / k3d). O cluster global da UMa usa k8s-global/.
# Os serviços da aplicação e as tags das imagens estão em apps/kustomization.yaml,
# partilhado pelos dois clusters (o CD atualiza as tags lá, com o Git SHA).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ticketmei

labels:
- pairs:
    app.kubernetes.io/part-of: ticketmei

resources:
- namespace.yaml
- infra/redis.yaml
- infra/rabbitmq.yaml
- apps            # base partilhada com o cluster global (k8s-global/)
- monitoring/prometheus.yaml
- monitoring/grafana.yaml

configMapGenerator:
- literals:
  - enabled_plugins=[rabbitmq_management,rabbitmq_prometheus].
  name: rabbitmq-plugins
- files:
  - prometheus.yml=monitoring/prometheus-k8s.yml
  name: prometheus-config
- files:
  - monitoring/grafana/provisioning/datasources/prometheus.yml
  name: grafana-datasources
- files:
  - monitoring/grafana/provisioning/dashboards/dashboards.yml
  name: grafana-dashboard-provider
- files:
  - monitoring/grafana/dashboards/gateway.json
  - monitoring/grafana/dashboards/catalog.json
  - monitoring/grafana/dashboards/order-notification.json
  - monitoring/grafana/dashboards/payment-circuit-breaker.json
  name: grafana-dashboards
