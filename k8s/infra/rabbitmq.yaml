apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels: {app: rabbitmq}
spec:
  replicas: 1
  strategy:
    type: Recreate          # um único broker de cada vez
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      hostname: rabbitmq    # nome do nó estável (rabbit@rabbitmq)
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - {containerPort: 5672, name: amqp}
            - {containerPort: 15672, name: management}
            - {containerPort: 15692, name: prometheus}
          volumeMounts:
            - name: plugins
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
          readinessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: plugins
          configMap:
            name: rabbitmq-plugins
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: {app: rabbitmq}
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    - {name: prometheus, port: 15692, targetPort: prometheus}
---
# UI de gestão em http://localhost:15672 (guest/guest)
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-management
  labels: {app: rabbitmq}
spec:
  type: LoadBalancer
  selector: {app: rabbitmq}
  ports:
    - {name: management, port: 15672, targetPort: management}
