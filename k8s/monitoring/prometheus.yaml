apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: ticketmei
---
# Permissões só de leitura: descobrir pods e ler métricas cAdvisor dos nós
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ticketmei-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, nodes, nodes/proxy, nodes/metrics, services, endpoints]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ticketmei-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ticketmei-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: ticketmei
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {app: prometheus}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.50.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - {containerPort: 9090, name: http}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: {app: prometheus}
spec:
  type: LoadBalancer        # http://localhost:9090
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: http}
