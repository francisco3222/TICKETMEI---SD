# Grafana com datasource e dashboards provisionados a partir de ConfigMaps
# (gerados pelo kustomization.yaml a partir de k8s/monitoring/grafana/).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {app: grafana}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.3.1
          ports:
            - {containerPort: 3000, name: http}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
            - {name: data, mountPath: /var/lib/grafana}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: dashboard-provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboards
          configMap: {name: grafana-dashboards}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: {app: grafana}
spec:
  type: LoadBalancer        # http://localhost:3000 (admin/admin)
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: http}
