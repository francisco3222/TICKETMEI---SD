# Único ponto de entrada externo: o API Gateway.
#   http://grupo04-ticketmei.10.2.15.161.nip.io/events
# (Mesmo padrão nip.io dos endereços do ArgoCD/Grafana/RabbitMQ do cluster. Usa a IngressClass
#  por omissão do cluster; se o professor indicar outra, acrescentar spec.ingressClassName.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
spec:
  rules:
    - host: grupo04-ticketmei.10.2.15.161.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
