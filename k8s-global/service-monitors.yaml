# ServiceMonitor (template do professor): o Prometheus do cluster recolhe /metrics do api-gateway
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway-monitor
  labels:
    release: kube-prometheus-stack-prometheus   # tem de coincidir com o serviceMonitorSelector do Prometheus
spec:
  selector:
    matchLabels:
      app: api-gateway
  endpoints:
    - port: http               # nome da porta no Service de k8s/apps/api-gateway.yaml
      path: /metrics
      interval: 15s
---
