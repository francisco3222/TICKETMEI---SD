# No cluster global o gateway fica atrás do Ingress: Service interno (ClusterIP).
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: ClusterIP
---
# Atrás do Ingress todos os pedidos chegam com o IP do controlador de ingress;
# o IP real do cliente vem no X-Forwarded-For (o gateway usa a última entrada, a do proxy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  template:
    spec:
      containers:
        - name: api-gateway
          env:
            - {name: TRUST_PROXY_HEADERS, value: "true"}
